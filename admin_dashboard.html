<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIGOBOT Admin Dashboard</title>
    <style>
        /* ==========================================
           THEME VARIABLES - DARK (default)
           ========================================== */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-hover: #1a2332;
            --bg-input: #0f172a;
            --border: #334155;
            --border-light: #475569;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-bg: #1e3a5f;
            --success: #22c55e;
            --success-hover: #16a34a;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --badge-free-bg: #334155; --badge-free-fg: #94a3b8;
            --badge-basic-bg: #1e3a5f; --badge-basic-fg: #60a5fa;
            --badge-pro-bg: #3b2f1a; --badge-pro-fg: #fbbf24;
            --badge-enterprise-bg: #1a3b2a; --badge-enterprise-fg: #4ade80;
            --badge-test-bg: #0f3a3a; --badge-test-fg: #2dd4bf;
            --modal-bg: #1e293b;
            --shadow: rgba(0,0,0,0.3);
            --toast-success: #22c55e;
            --toast-error: #ef4444;
        }

        /* ==========================================
           THEME VARIABLES - LIGHT
           ========================================== */
        :root[data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --bg-hover: #f1f5f9;
            --bg-input: #ffffff;
            --border: #cbd5e1;
            --border-light: #94a3b8;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-bg: #dbeafe;
            --success: #16a34a;
            --success-hover: #15803d;
            --warning: #d97706;
            --warning-hover: #b45309;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --badge-free-bg: #e2e8f0; --badge-free-fg: #475569;
            --badge-basic-bg: #dbeafe; --badge-basic-fg: #2563eb;
            --badge-pro-bg: #fef3c7; --badge-pro-fg: #b45309;
            --badge-enterprise-bg: #dcfce7; --badge-enterprise-fg: #16a34a;
            --badge-test-bg: #ccfbf1; --badge-test-fg: #0d9488;
            --modal-bg: #ffffff;
            --shadow: rgba(0,0,0,0.1);
            --toast-success: #16a34a;
            --toast-error: #dc2626;
        }

        /* ==========================================
           BASE STYLES (theme-aware)
           ========================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }

        .header { background: var(--bg-secondary); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.5rem; color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .header-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-light); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .header-btn:hover { background: var(--border-light); }

        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: var(--bg-secondary); padding: 40px; border-radius: 12px; width: 400px; box-shadow: 0 8px 32px var(--shadow); border: 1px solid var(--border); }
        .login-box h2 { text-align: center; margin-bottom: 24px; color: var(--accent); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 1rem; direction: ltr; text-align: left; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .login-box button:hover { background: var(--accent-hover); }

        .dashboard { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 24px 30px; }
        .stat-card { background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid var(--border); transition: background 0.3s; }
        .stat-card .label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: var(--accent); }

        .section { padding: 0 30px 24px; }
        .section-title { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .actions-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .actions-bar input, .actions-bar select { padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 0.9rem; }

        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: var(--success-hover); }
        .btn-warning { background: var(--warning); color: #1e293b; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.78rem; }

        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; transition: background 0.3s; }
        th { background: var(--bg-tertiary); padding: 12px 16px; text-align: right; font-size: 0.8rem; color: var(--text-secondary); }
        td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.85rem; }
        tr:hover { background: var(--bg-hover); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-free { background: var(--badge-free-bg); color: var(--badge-free-fg); }
        .badge-basic { background: var(--badge-basic-bg); color: var(--badge-basic-fg); }
        .badge-pro { background: var(--badge-pro-bg); color: var(--badge-pro-fg); }
        .badge-enterprise { background: var(--badge-enterprise-bg); color: var(--badge-enterprise-fg); }
        .badge-test { background: var(--badge-test-bg); color: var(--badge-test-fg); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--modal-bg); padding: 28px; border-radius: 12px; width: 440px; max-width: 90vw; border: 1px solid var(--border); }
        .modal h3 { margin-bottom: 16px; color: var(--accent); }
        .modal label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary); }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        .modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

        .toast { position: fixed; bottom: 24px; left: 24px; background: var(--toast-success); color: white; padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; z-index: 200; display: none; }
        .toast.error { background: var(--toast-error); }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .detail-item { padding: 10px; background: var(--bg-input); border-radius: 8px; border: 1px solid var(--border); }
        .detail-item .dl { font-size: 0.75rem; color: var(--text-muted); }
        .detail-item .dv { font-size: 0.95rem; color: var(--text-primary); margin-top: 4px; }

        [lang="en"] { direction: ltr; text-align: left; }
        [lang="en"] th, [lang="en"] td { text-align: left; }

        /* Theme toggle icon */
        .theme-icon { font-size: 1rem; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
    <div style="position:fixed;top:20px;right:20px;">
        <button class="header-btn" onclick="toggleTheme()" id="themeBtn"><span class="theme-icon">🌙</span></button>
        <button class="header-btn" onclick="toggleLang()" id="langBtn" style="margin-right:6px;">EN | فارسی</button>
    </div>
    <div class="login-box">
        <h2 id="loginTitle">🤖 OLIGOBOT Admin</h2>
        <input type="number" id="loginAdminId" data-i18n="placeholder_admin_id" placeholder="Admin ID (Telegram)" />
        <input type="password" id="loginSecret" data-i18n="placeholder_secret" placeholder="Secret Key" />
        <button onclick="doLogin()" id="loginBtn">ورود</button>
        <p id="loginError" style="color:var(--danger);text-align:center;margin-top:12px;font-size:0.85rem;display:none;"></p>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <div>
            <h1>🤖 OLIGOBOT <span data-i18n="dashboard_title">Admin Dashboard</span></h1>
            <div class="admin-info" id="adminLabel"></div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="toggleTheme()" id="themeBtnDash"><span class="theme-icon">🌙</span></button>
            <button class="header-btn" onclick="toggleLang()" id="langBtnDash">EN | فارسی</button>
            <button class="header-btn" onclick="doLogout()" data-i18n="logout">خروج</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="label" data-i18n="stat_total_users">کل کاربران</div><div class="value" id="statTotal">-</div></div>
        <div class="stat-card"><div class="label" data-i18n="stat_queries_today">سوالات امروز</div><div class="value" id="statQueries">-</div></div>
        <div class="stat-card"><div class="label" data-i18n="stat_overrides">اکتیو overrides</div><div class="value" id="statOverrides">-</div></div>
        <div class="stat-card"><div class="label" data-i18n="stat_payments">عملیات پرداخت</div><div class="value" id="statPayments">-</div></div>
    </div>

    <div class="section">
        <div class="section-title" data-i18n="quick_actions">⚡ عملیات سریع</div>
        <div class="actions-bar">
            <input type="number" id="quickUserId" data-i18n="placeholder_user_id" placeholder="User ID" style="width:150px;" />
            <select id="quickDays">
                <option value="3">3 <span data-i18n="days">روز</span></option>
                <option value="7" selected>7 <span data-i18n="days">روز</span></option>
                <option value="30">30 <span data-i18n="days">روز</span></option>
                <option value="90">90 <span data-i18n="days">روز</span></option>
            </select>
            <button class="btn btn-success btn-sm" onclick="quickAction('grant-test')" data-i18n="btn_test_free">🧪 تست رایگان</button>
            <button class="btn btn-primary btn-sm" onclick="quickAction('grant-free')" data-i18n="btn_free_access">🎁 دسترسی رایگان</button>
            <button class="btn btn-warning btn-sm" onclick="quickAction('give-pro')" data-i18n="btn_give_pro">⭐ اشتراک PRO</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title" data-i18n="user_management">👥 مدیریت کاربران</div>
        <div class="actions-bar">
            <input type="text" id="searchInput" data-i18n="placeholder_search" placeholder="جستجوی User ID..." style="width:200px;" oninput="filterUsers()" />
            <select id="filterTier" onchange="filterUsers()">
                <option value="" data-i18n="filter_all">همه تی‌ها</option>
                <option value="free">Free</option>
                <option value="basic">Basic</option>
                <option value="pro">Pro</option>
                <option value="enterprise">Enterprise</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="loadUsers()" data-i18n="btn_refresh">🔄 بروزرسانی</button>
        </div>
        <table>
            <thead><tr>
                <th>User ID</th>
                <th data-i18n="th_tier">تی‌ر</th>
                <th data-i18n="th_status">وضعیت</th>
                <th data-i18n="th_usage">Usage امروز</th>
                <th data-i18n="th_total">کل سوالات</th>
                <th data-i18n="th_last_active">آخرین فعالیت</th>
                <th data-i18n="th_override">Override</th>
                <th data-i18n="th_expires">انقضا</th>
                <th data-i18n="th_actions">عملیات</th>
            </tr></thead>
            <tbody id="usersTable"></tbody>
        </table>
    </div>

    <div class="section">
        <div class="section-title" data-i18n="payment_history">📋 تاریخچه عملیات</div>
        <table>
            <thead><tr>
                <th data-i18n="th_time">زمان</th>
                <th>User ID</th>
                <th data-i18n="th_action">عملیات</th>
                <th data-i18n="th_tier">تی‌ر</th>
                <th data-i18n="th_admin">ادمین</th>
                <th data-i18n="th_note">یادداشت</th>
            </tr></thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
</div>

<!-- USER MODAL -->
<div class="modal-overlay" id="userModal">
    <div class="modal">
        <h3><span data-i18n="modal_user_details">جزئیات کاربر</span> <span id="modalUserId"></span></h3>
        <div class="user-detail" id="modalUserDetail"></div>
        <hr style="border-color:var(--border);margin:16px 0;" />
        <label data-i18n="modal_change_tier">تغییر تی‌ر:</label>
        <div class="actions-bar" style="margin-bottom:0;">
            <select id="modalTier">
                <option value="free">Free</option>
                <option value="basic">Basic</option>
                <option value="pro">Pro</option>
                <option value="enterprise">Enterprise</option>
            </select>
            <select id="modalDuration">
                <option value="7">7 <span data-i18n="days">روز</span></option>
                <option value="30" selected>30 <span data-i18n="days">روز</span></option>
                <option value="90">90 <span data-i18n="days">روز</span></option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="setTier()" data-i18n="btn_apply">اعمال</button>
        </div>
        <label style="margin-top:12px;" data-i18n="modal_admin_notes">یادداشت ادمین:</label>
        <textarea id="modalNotes" rows="2" data-i18n="placeholder_notes" placeholder="یادداشت..."></textarea>
        <div class="btn-row">
            <button class="btn btn-sm" style="background:var(--bg-tertiary);color:var(--text-secondary);" onclick="closeModal()" data-i18n="btn_close">بستن</button>
            <button class="btn btn-danger btn-sm" onclick="cancelSub()" data-i18n="btn_cancel_sub">لغو اشتراک</button>
            <button class="btn btn-success btn-sm" onclick="saveNotes()" data-i18n="btn_save_notes">ذخیره یادداشت</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// THEME SYSTEM
// ==========================================
let currentTheme = localStorage.getItem('admin_theme') || 'dark';

function setTheme(theme) {
    currentTheme = theme;
    localStorage.setItem('admin_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    
    const icon = theme === 'dark' ? '☀️' : '🌙';
    document.querySelectorAll('.theme-icon').forEach(el => el.textContent = icon);
}

function toggleTheme() {
    setTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// ==========================================
// I18N - LANGUAGE SYSTEM
// ==========================================
const I18N = {
    fa: {
        dashboard_title: "Admin Dashboard",
        login_title: "OLIGOBOT Admin",
        login_btn: "ورود",
        logout: "خروج",
        placeholder_admin_id: "Admin ID (Telegram)",
        placeholder_secret: "Secret Key",
        placeholder_user_id: "User ID",
        placeholder_search: "جستجوی User ID...",
        placeholder_notes: "یادداشت...",
        stat_total_users: "کل کاربران",
        stat_queries_today: "سوالات امروز",
        stat_overrides: "اکتیو overrides",
        stat_payments: "عملیات پرداخت",
        quick_actions: "⚡ عملیات سریع",
        user_management: "👥 مدیریت کاربران",
        payment_history: "📋 تاریخچه عملیات",
        btn_test_free: "🧪 تست رایگان",
        btn_free_access: "🎁 دسترسی رایگان",
        btn_give_pro: "⭐ اشتراک PRO",
        btn_refresh: "🔄 بروزرسانی",
        btn_apply: "اعمال",
        btn_close: "بستن",
        btn_cancel_sub: "لغو اشتراک",
        btn_save_notes: "ذخیره یادداشت",
        btn_manage: "مدیریت",
        th_tier: "تی‌ر", th_status: "وضعیت", th_usage: "Usage امروز",
        th_override: "Override", th_expires: "انقضا", th_actions: "عملیات",
        th_total: "کل سوالات", th_last_active: "آخرین فعالیت",
        th_time: "زمان", th_action: "عملیات", th_admin: "ادمین", th_note: "یادداشت",
        modal_user_details: "جزئیات کاربر",
        modal_change_tier: "تغییر تی‌ر:",
        modal_admin_notes: "یادداشت ادمین:",
        days: "روز", filter_all: "همه تی‌ها",
        confirm_cancel: "آیا از لغو اشتراک مطمئن هستید؟",
        notes_saved: "یادداشت ذخیره شد",
    },
    en: {
        dashboard_title: "Admin Dashboard",
        login_title: "OLIGOBOT Admin",
        login_btn: "Login",
        logout: "Logout",
        placeholder_admin_id: "Admin ID (Telegram)",
        placeholder_secret: "Secret Key",
        placeholder_user_id: "User ID",
        placeholder_search: "Search User ID...",
        placeholder_notes: "Notes...",
        stat_total_users: "Total Users",
        stat_queries_today: "Queries Today",
        stat_overrides: "Active Overrides",
        stat_payments: "Payment Actions",
        quick_actions: "⚡ Quick Actions",
        user_management: "👥 User Management",
        payment_history: "📋 Action History",
        btn_test_free: "🧪 Test Mode",
        btn_free_access: "🎁 Free Access",
        btn_give_pro: "⭐ Give PRO",
        btn_refresh: "🔄 Refresh",
        btn_apply: "Apply",
        btn_close: "Close",
        btn_cancel_sub: "Cancel Sub",
        btn_save_notes: "Save Notes",
        btn_manage: "Manage",
        th_tier: "Tier", th_status: "Status", th_usage: "Usage Today",
        th_override: "Override", th_expires: "Expires", th_actions: "Actions",
        th_total: "Total Queries", th_last_active: "Last Active",
        th_time: "Time", th_action: "Action", th_admin: "Admin", th_note: "Note",
        modal_user_details: "User Details",
        modal_change_tier: "Change Tier:",
        modal_admin_notes: "Admin Notes:",
        days: "days", filter_all: "All Tiers",
        confirm_cancel: "Are you sure you want to cancel this subscription?",
        notes_saved: "Notes saved",
    }
};

let currentLang = localStorage.getItem('admin_lang') || 'fa';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('admin_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key]) {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = I18N[lang][key];
            else el.textContent = I18N[lang][key];
        }
    });
    document.querySelectorAll('#langBtn, #langBtnDash').forEach(b => b.textContent = lang === 'fa' ? 'EN | فارسی' : 'فارسی | EN');
    if (allUsers.length) renderUsers(allUsers);
}

function toggleLang() { setLang(currentLang === 'fa' ? 'en' : 'fa'); }
function t(key) { return I18N[currentLang][key] || key; }

// ==========================================
// AUTH & API
// ==========================================
const API_BASE = window.location.origin;
let adminId = null, adminSecret = null, allUsers = [], selectedUserId = null;

function showLogin() { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; }

function doLogin() {
    adminId = parseInt(document.getElementById('loginAdminId').value);
    adminSecret = document.getElementById('loginSecret').value;
    if (!adminId) { showLoginError(currentLang === 'fa' ? 'Admin ID را وارد کنید' : 'Enter Admin ID'); return; }
    if (!adminSecret) { showLoginError(currentLang === 'fa' ? 'Secret Key را وارد کنید' : 'Enter Secret Key'); return; }
    document.getElementById('adminLabel').textContent = (currentLang === 'fa' ? 'ادمین' : 'Admin') + ': ' + adminId;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadStats(); loadUsers(); loadHistory();
}

function doLogout() { adminId = null; adminSecret = null; showLogin(); }
function showLoginError(msg) { const el = document.getElementById('loginError'); el.textContent = msg; el.style.display = 'block'; }

async function api(path, method = 'GET', body = null) {
    const sep = path.includes('?') ? '&' : '?';
    const url = `${API_BASE}${path}${sep}admin_id=${adminId}`;
    const opts = { method, headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': adminSecret } };
    if (body) opts.body = JSON.stringify(body);
    try {
        const res = await fetch(url, opts);
        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'API Error'); }
        return await res.json();
    } catch (e) { showToast(e.message, true); return null; }
}

// ==========================================
// DATA LOADING
// ==========================================
async function loadStats() {
    const d = await api('/api/stats');
    if (!d) return;
    document.getElementById('statTotal').textContent = d.total_users || 0;
    document.getElementById('statQueries').textContent = d.total_queries_today || 0;
    document.getElementById('statOverrides').textContent = d.active_overrides || 0;
    document.getElementById('statPayments').textContent = d.total_payments || 0;
}

async function loadUsers() {
    const d = await api('/api/users');
    if (!d) return;
    allUsers = d;
    renderUsers(d);
}

function renderUsers(users) {
    const locale = currentLang === 'fa' ? 'fa-IR' : 'en-US';
    document.getElementById('usersTable').innerHTML = users.map(u => {
        const lastActive = u.last_active_at ? new Date(u.last_active_at).toLocaleString(locale, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
        return `<tr>
        <td><strong>${u.user_id}</strong></td>
        <td><span class="badge badge-${u.tier}">${u.tier_label || u.tier}</span></td>
        <td>${u.is_active ? '✅' : '❌'}</td>
        <td>${u.daily_used} / ${u.daily_limit === -1 ? '∞' : u.daily_limit}</td>
        <td>${u.total_queries_all_time || 0}</td>
        <td style="font-size:0.8rem;color:var(--text-secondary);">${lastActive}</td>
        <td>${u.has_override ? '<span class="badge badge-test">' + (u.override_type || '') + '</span>' : '-'}</td>
        <td>${u.expires_at ? new Date(u.expires_at).toLocaleDateString(locale) : '-'}</td>
        <td><button class="btn btn-primary btn-sm" onclick="openUserModal(${u.user_id})">${t('btn_manage')}</button></td>
    </tr>`;
    }).join('');
}

function filterUsers() {
    const q = document.getElementById('searchInput').value.trim();
    const tier = document.getElementById('filterTier').value;
    let f = allUsers;
    if (q) f = f.filter(u => String(u.user_id).includes(q));
    if (tier) f = f.filter(u => u.tier === tier);
    renderUsers(f);
}

async function loadHistory() {
    const d = await api('/api/payment-history?limit=30');
    if (!d) return;
    const locale = currentLang === 'fa' ? 'fa-IR' : 'en-US';
    document.getElementById('historyTable').innerHTML = d.map(p => `<tr>
        <td>${p.timestamp ? new Date(p.timestamp).toLocaleString(locale) : '-'}</td>
        <td>${p.user_id}</td><td>${p.action}</td><td>${p.tier || '-'}</td>
        <td>${p.admin_id || '-'}</td><td>${p.note || '-'}</td>
    </tr>`).join('');
}

// ==========================================
// QUICK ACTIONS
// ==========================================
async function quickAction(action) {
    const uid = parseInt(document.getElementById('quickUserId').value);
    const days = parseInt(document.getElementById('quickDays').value);
    if (!uid) { showToast(currentLang === 'fa' ? 'User ID را وارد کنید' : 'Enter User ID', true); return; }
    const d = await api(`/api/quick/${action}?user_id=${uid}&days=${days}`, 'POST');
    if (d) { showToast(d.message); loadUsers(); loadStats(); loadHistory(); }
}

// ==========================================
// USER MODAL
// ==========================================
async function openUserModal(userId) {
    selectedUserId = userId;
    document.getElementById('modalUserId').textContent = userId;
    const d = await api(`/api/users/${userId}`);
    if (!d) return;
    const { subscription: sub, tier_config: tier, override: ov } = d;
    const locale = currentLang === 'fa' ? 'fa-IR' : 'en-US';
    document.getElementById('modalUserDetail').innerHTML = `
        <div class="detail-item"><div class="dl">${t('th_tier')}</div><div class="dv">${tier.label} (${sub.tier})</div></div>
        <div class="detail-item"><div class="dl">${t('th_usage')}</div><div class="dv">${sub.daily_queries_used||0} / ${tier.daily_queries===-1?'∞':tier.daily_queries}</div></div>
        <div class="detail-item"><div class="dl">${t('th_total')}</div><div class="dv">${sub.total_queries_all_time||0}</div></div>
        <div class="detail-item"><div class="dl">${t('th_last_active')}</div><div class="dv">${sub.last_active_at?new Date(sub.last_active_at).toLocaleString(locale):'-'}</div></div>
        <div class="detail-item"><div class="dl">${t('th_expires')}</div><div class="dv">${sub.expires_at?new Date(sub.expires_at).toLocaleDateString(locale):'-'}</div></div>
        <div class="detail-item"><div class="dl">Remaining</div><div class="dv">${d.remaining_queries>99999?'∞':d.remaining_queries}</div></div>
        ${ov?`<div class="detail-item" style="grid-column:span 2"><div class="dl">${t('th_override')}</div><div class="dv">🧪 ${ov.type} (${ov.expires_at?new Date(ov.expires_at).toLocaleDateString(locale):'permanent'})</div></div>`:''}`;
    document.getElementById('modalTier').value = sub.tier;
    document.getElementById('modalNotes').value = sub.admin_notes || '';
    document.getElementById('userModal').classList.add('active');
}

function closeModal() { document.getElementById('userModal').classList.remove('active'); selectedUserId = null; }

async function setTier() {
    if (!selectedUserId) return;
    const d = await api('/api/subscription/set', 'POST', { user_id: selectedUserId, tier: document.getElementById('modalTier').value, duration_days: parseInt(document.getElementById('modalDuration').value) });
    if (d) { showToast(d.message); closeModal(); loadUsers(); loadStats(); loadHistory(); }
}

async function cancelSub() {
    if (!selectedUserId) return;
    if (!confirm(t('confirm_cancel'))) return;
    const d = await api('/api/subscription/cancel', 'POST', { user_id: selectedUserId, reason: 'Admin cancelled' });
    if (d) { showToast(d.message); closeModal(); loadUsers(); loadStats(); loadHistory(); }
}

async function saveNotes() {
    if (!selectedUserId) return;
    const d = await api('/api/user/notes', 'POST', { user_id: selectedUserId, notes: document.getElementById('modalNotes').value });
    if (d) showToast(t('notes_saved'));
}

function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => el.className = 'toast', 3000);
}

// ==========================================
// INIT
// ==========================================
window.onload = () => { setTheme(currentTheme); setLang(currentLang); showLogin(); };
</script>
</body>
</html>
